# Publish a tagged Android release in two jobs: `bundle` builds the signed bundle and APK, keeps
# them as the run's artifact and creates the GitHub release with the APK attached; `play` uploads
# that same bundle to Play's internal testing track, rolled out to testers. Started by
# android-cut.yml. If Play refuses, re-run the failed job: it uploads the bundle already built. An
# app's first publish fails at Play, which wants that bundle uploaded by hand: take it from the
# artifact. Promote it in the Play Console.
#
# Secrets: ANDROID_KEYSTORE (the upload keystore, base64), ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, and PLAY_SERVICE_ACCOUNT_JSON (a service account key
# with release rights in the Play Console).
name: android-publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to publish (e.g. android-v0.1.1)
        required: true
        type: string

permissions: {}

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: restore signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: base64 --decode <<< "$ANDROID_KEYSTORE" > "$RUNNER_TEMP/upload.jks"
      - name: build the bundle and APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew :app:bundleRelease :app:assembleRelease
          "-Preader.storeFile=$RUNNER_TEMP/upload.jks"
          "-Preader.storePassword=$STORE_PASSWORD"
          "-Preader.keyAlias=$KEY_ALIAS"
          "-Preader.keyPassword=$KEY_PASSWORD"
      - name: name the outputs after the tag
        env:
          tag: ${{ inputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/out/h-reader-$tag.aab"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/h-reader-$tag.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: h-reader-${{ inputs.tag }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          tag: ${{ inputs.tag }}
        run: |
          apk="$RUNNER_TEMP/out/h-reader-$tag.apk"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
            exit 0
          fi
          # notes cover only what changed since the last Android release
          if previous=$(git describe --tags --abbrev=0 --match "android-v*" "$tag^" 2>/dev/null); then
            gh release create "$tag" --generate-notes --verify-tag --notes-start-tag "$previous" "$apk"
          else
            gh release create "$tag" --generate-notes --verify-tag "$apk"
          fi

  play:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - uses: actions/download-artifact@v8
        with:
          name: h-reader-${{ inputs.tag }}
          path: ${{ runner.temp }}/bundle
      # the artifact also holds the APK, which --artifact-dir would offer to Play
      - run: rm "$RUNNER_TEMP"/bundle/*.apk
      - name: upload to Play
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        # Play refuses a rolled-out release while the app has never passed review; a draft is rolled out by hand.
        run: |
          publish() {
            ./gradlew :app:publishReleaseBundle --release-status "$1" \
              --artifact-dir "$RUNNER_TEMP/bundle"
          }
          if ! publish completed; then
            echo "::warning::Play refused a rolled-out release; uploading a draft to roll out by hand."
            publish draft
          fi
