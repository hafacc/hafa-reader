# Publish main's web app to GitHub Pages; started by hand, like a cut of the extension.
name: web-deploy

on: workflow_dispatch

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # the branch tip, not the dispatch SHA
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: shared
      - run: bun install --frozen-lockfile
      - run: bun lint
      - run: bun test
      - run: bun export
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
